name: nexussklad-staging

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${NEXUSSKLAD_LOG_MAX_SIZE:-10m}
    max-file: "${NEXUSSKLAD_LOG_MAX_FILES:-5}"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexussklad-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nexussklad_postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: nexussklad-api-staging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_NEXUSSKLAD_API_BASE_URL: ""
    container_name: nexussklad-web-staging
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${NEXUSSKLAD_WEB_PORT:-8080}:80"
    logging: *default-logging

volumes:
  nexussklad_postgres_data:
