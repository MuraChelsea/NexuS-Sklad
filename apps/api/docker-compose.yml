services:
  postgres:
    image: postgres:16-alpine
    container_name: nexussklad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexussklad
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nexussklad_postgres_data:/var/lib/postgresql/data

volumes:
  nexussklad_postgres_data:
